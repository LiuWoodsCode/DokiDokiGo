<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ query or 'Search' }} - DokiDokiGo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script type="module" src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body class="results-page">
    <header class="results-header">
        <a class="site-name" href="{{ url_for('index') }}">DokiDokiGo</a>
        <form class="search-form" action="{{ url_for('search') }}" method="get" role="search">
            <fluent-text-field name="q" type="search" appearance="outline" value="{{ query }}" placeholder="Search the web" aria-label="Search the web" required autofocus></fluent-text-field>
            <fluent-button type="submit" appearance="accent">Search</fluent-button>
        </form>
    </header>
    <fluent-divider></fluent-divider>

    <main class="results-content">
        {% for result in results %}
        <article class="result">
            <a class="result-link" href="{{ result.href }}">
                <h2 class="result-title">{{ result.title }}</h2>
                <p class="result-url">{{ result.href }}</p>
                <p class="result-body">{{ result.body }}</p>
            </a>
        </article>
        {% endfor %}
    </main>
</body>
</html>
