<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ query or 'Search' }} - DokiDokiGo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script type="module" src="{{ url_for('static', filename='fwc.js') }}"></script>
</head>
<body class="results-page">
    <header class="results-header">
        <fluent-text size="600" weight="semibold"><fluent-link href="{{ url_for('index') }}">DokiDokiGo</fluent-link></fluent-text>
        <form class="search-form" action="{{ url_for('search') }}" method="get" role="search">
            <fluent-text-input name="q" type="search" control-size="large" value="{{ query }}" placeholder="Search the web" aria-label="Search the web" required autofocus></fluent-text-input>
            <fluent-button type="submit" appearance="primary" size="large">Search</fluent-button>
        </form>
    </header>
    <fluent-divider></fluent-divider>

    <main class="results-content">
        {% for result in results %}
        <article class="result">
            <fluent-text size="500" block><fluent-link href="{{ result.href }}">{{ result.title }}</fluent-link></fluent-text>
            <fluent-text size="200" block>{{ result.href }}</fluent-text>
            <fluent-text block>{{ result.body }}</fluent-text>
        </article>
        {% endfor %}
    </main>
</body>
</html>
